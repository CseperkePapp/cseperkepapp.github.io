<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Buoyant — a study in bounce</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Space+Mono&display=swap" rel="stylesheet" />
<style>
  :root{--paper:#eef0ea;--ink:#181a15;--dim:#83867b;--acc:#2f5bd0}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--paper);color:var(--ink);font-family:"Fraunces",serif;overflow:hidden;
    display:flex;align-items:center;justify-content:center;text-align:center;-webkit-font-smoothing:antialiased;cursor:pointer}
  .bar{position:fixed;top:clamp(18px,3vw,34px);left:0;right:0;display:flex;justify-content:space-between;
    padding:0 clamp(18px,3vw,34px);font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--dim);z-index:3}
  .bar a{color:var(--dim);text-decoration:none;border-bottom:1px solid transparent;transition:.4s}
  .bar a:hover{color:var(--ink);border-color:var(--ink)}

  .clip{padding:0 4vw}
  h1{font-weight:600;font-size:clamp(60px,17vw,250px);line-height:1.14;letter-spacing:-.02em;user-select:none;display:flex}
  h1 span{display:inline-block;opacity:0;will-change:transform}
  h1 span.sp{width:.28em}
  h1.go span{animation:drop 1.3s both}

  @keyframes drop{
    0%  {transform:translateY(-165%);opacity:0;animation-timing-function:cubic-bezier(.45,0,.9,.45)}
    10% {opacity:1}
    34% {transform:translateY(0);animation-timing-function:cubic-bezier(.1,.55,.3,1)}
    54% {transform:translateY(-26%);animation-timing-function:cubic-bezier(.45,0,.9,.45)}
    70% {transform:translateY(0);animation-timing-function:cubic-bezier(.1,.55,.3,1)}
    83% {transform:translateY(-10%);animation-timing-function:cubic-bezier(.45,0,.9,.45)}
    92% {transform:translateY(0);animation-timing-function:cubic-bezier(.1,.55,.3,1)}
    97% {transform:translateY(-3.5%)}
    100%{transform:translateY(0)}
  }

  .cap{position:fixed;left:0;right:0;bottom:clamp(22px,4vw,40px);text-align:center;font-style:italic;font-weight:400;
    color:var(--dim);font-size:clamp(14px,1.8vw,20px)}
  .cap b{font-style:normal;color:var(--acc);font-weight:600}
</style>
</head>
<body>
  <div class="bar">
    <span>06 · Bounce</span>
    <a href="../index.html">← Type Motion</a>
  </div>

  <div class="clip"><h1 id="w" aria-label="Buoyant"></h1></div>
  <p class="cap"><b>Click anywhere</b> to drop them again.</p>

<script>
(function(){
  const word='Buoyant';
  const el=document.getElementById('w');
  const spans=[];
  [...word].forEach(ch=>{
    const s=document.createElement('span');
    if(ch===' '){ s.className='sp'; }
    else s.textContent=ch;
    el.appendChild(s); spans.push(s);
  });
  spans.forEach((s,i)=>s.style.animationDelay=(i*0.085).toFixed(3)+'s');

  function play(){
    el.classList.remove('go');
    void el.offsetWidth;      // reflow to restart the animation
    el.classList.add('go');
  }
  (document.fonts?document.fonts.ready:Promise.resolve()).then(()=>setTimeout(play,180));
  addEventListener('pointerdown',play);
})();
</script>
</body>
</html>
