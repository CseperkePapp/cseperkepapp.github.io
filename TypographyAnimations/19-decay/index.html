<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Decay — a study in erosion</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=Space+Mono&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#1a1613;--ink:#e6ddd0;--dim:#8a8072;--acc:#a8632e;--line:rgba(230,221,208,.16);--on:#fff}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Fraunces",serif;overflow:hidden;
    display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased;cursor:pointer}
  .bar{position:fixed;top:clamp(18px,3vw,34px);left:0;right:0;display:flex;justify-content:space-between;
    padding:0 clamp(18px,3vw,34px);font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--dim);z-index:3}
  .bar a{color:var(--dim);text-decoration:none;border-bottom:1px solid transparent;transition:.4s}
  .bar a:hover{color:var(--ink);border-color:var(--ink)}

  #flakes{position:fixed;inset:0;z-index:2;pointer-events:none}
  .flake{position:fixed;width:4px;height:4px;background:var(--acc);will-change:transform,opacity}

  .word{font-weight:500;font-size:clamp(50px,15vw,220px);line-height:.9;letter-spacing:-.01em;user-select:none;will-change:filter,opacity,transform}
  .word span{display:inline-block;will-change:transform}

  .cap{position:fixed;left:0;right:0;bottom:clamp(22px,4vw,40px);text-align:center;font-style:italic;font-weight:300;
    color:var(--dim);font-size:clamp(14px,1.8vw,20px);z-index:3}
  .cap b{font-style:normal;color:var(--acc);font-weight:400}

  .panel{position:fixed;top:calc(clamp(18px,3vw,34px) + 32px);right:clamp(18px,3vw,34px);z-index:4;width:224px;
    font-family:"Space Mono",monospace;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(6px)}
  .panel .head{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;cursor:pointer;
    font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
  .panel .head .tw{color:var(--ink)}
  .panel .body{padding:2px 13px 14px;display:flex;flex-direction:column;gap:13px}
  .panel.collapsed .body{display:none}
  .row{display:flex;flex-direction:column;gap:6px}
  .row label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between;gap:8px}
  .row label .val{color:var(--ink)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2px;background:var(--line);border-radius:2px;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--acc);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--acc);cursor:pointer}
  .seg-ctl{display:flex;gap:2px;border:1px solid var(--line);border-radius:20px;padding:2px}
  .seg-ctl button{flex:1;font-family:inherit;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
    background:transparent;border:0;padding:6px;border-radius:20px;cursor:pointer;transition:.3s}
  .seg-ctl button.active{background:var(--acc);color:var(--on)}
</style>
</head>
<body>
  <div class="bar"><span>Time &amp; change · Decay</span><a href="../index.html">← Type Motion</a></div>

  <div id="flakes"></div>
  <div class="word" id="word"></div>

  <p class="cap">It erodes with time — <b>hover</b> hastens it, <b>click</b> renews.</p>

  <div class="panel" id="panel">
    <div class="head" id="panelHead"><span>Parameters</span><span class="tw">tweak ▾</span></div>
    <div class="body" id="panelBody"></div>
  </div>

<script>
(function(){
  const cfg = {
    rate:     0.12,  // decay per second (1 = fully gone)
    maxBlur:  5,     // blur at full decay (px)
    flakeRate:34,    // flakes shed per second at full decay
    drop:     46,    // how far it sags (px)
    auto:     true   // renew after fully decayed
  };

  const wordEl=document.getElementById('word'), flakeLayer=document.getElementById('flakes');
  const word='decay';
  const spans=[...word].map(ch=>{ const s=document.createElement('span'); s.textContent=ch; s.__j=Math.random()*Math.PI*2; wordEl.appendChild(s); return s; });
  let centers=[];
  function measure(){ centers=spans.map(s=>{ const r=s.getBoundingClientRect(); return {x:r.left+r.width/2, y:r.top+r.height/2}; }); }
  (document.fonts?document.fonts.ready:Promise.resolve()).then(()=>setTimeout(measure,60));
  setTimeout(measure,400); addEventListener('resize',measure);

  let d=0, hovering=false, holdT=0, last=performance.now();
  const flakes=[];
  wordEl.addEventListener('pointerenter',()=>hovering=true);
  wordEl.addEventListener('pointerleave',()=>hovering=false);

  function frame(now){
    let dt=Math.min((now-last)/1000,.032); last=now;
    const speed=cfg.rate*(hovering?3.2:1);
    if(d<1){ d+=speed*dt; if(d>1)d=1; }
    else { holdT+=dt; if(cfg.auto && holdT>1.6){ d=0; holdT=0; } }

    wordEl.style.opacity=(1-0.68*d).toFixed(3);
    wordEl.style.filter='blur('+(d*cfg.maxBlur).toFixed(2)+'px)';
    for(let i=0;i<spans.length;i++){
      const j=Math.sin(now/700+spans[i].__j)*d*4;
      spans[i].style.transform='translate('+j.toFixed(1)+'px,'+(d*cfg.drop).toFixed(1)+'px) rotate('+(Math.sin(spans[i].__j)*d*6).toFixed(1)+'deg)';
    }

    // shed flakes
    if(centers.length){
      const n=cfg.flakeRate*d*dt;
      let count=Math.floor(n)+(Math.random()<(n%1)?1:0);
      while(count-->0 && flakes.length<180){
        const c=centers[(Math.random()*centers.length)|0];
        const el=document.createElement('div'); el.className='flake';
        const s=2+Math.random()*4; el.style.width=el.style.height=s+'px';
        flakeLayer.appendChild(el);
        flakes.push({el, x:c.x+(Math.random()*2-1)*22, y:c.y+(Math.random()*2-1)*30, vx:(Math.random()*2-1)*24, vy:20+Math.random()*40, life:0, max:1.4+Math.random()});
      }
    }
    for(let k=flakes.length-1;k>=0;k--){
      const f=flakes[k]; f.vy+=140*dt; f.x+=f.vx*dt; f.y+=f.vy*dt; f.life+=dt;
      f.el.style.transform='translate('+f.x.toFixed(1)+'px,'+f.y.toFixed(1)+'px)';
      f.el.style.opacity=Math.max(0,1-f.life/f.max).toFixed(2);
      if(f.life>=f.max){ f.el.remove(); flakes.splice(k,1); }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  addEventListener('pointerdown', e=>{ if(e.target.closest('.panel')) return; d=0; holdT=0; });

  const spec=[
    {type:'range', key:'rate',     label:'Decay rate', min:.03,max:.6, step:.01},
    {type:'range', key:'maxBlur',  label:'Max blur',   min:0,  max:12, step:.5},
    {type:'range', key:'flakeRate',label:'Flakes',     min:0,  max:80, step:2},
    {type:'range', key:'drop',     label:'Sag',        min:0,  max:120,step:4},
    {type:'toggle',key:'auto',     label:'Auto-renew', options:[['off',false],['on',true]]}
  ];
  buildPanel(document.getElementById('panelBody'), spec, cfg);
  const panel=document.getElementById('panel');
  document.getElementById('panelHead').addEventListener('click',()=>panel.classList.toggle('collapsed'));

  function buildPanel(root, spec, cfg){
    spec.forEach(c=>{
      const row=document.createElement('div'); row.className='row';
      const lab=document.createElement('label'); lab.textContent=c.label;
      if(c.type==='range'){
        const val=document.createElement('span'); val.className='val'; val.textContent=cfg[c.key];
        lab.appendChild(val); row.appendChild(lab);
        const inp=document.createElement('input'); inp.type='range';
        inp.min=c.min; inp.max=c.max; inp.step=c.step; inp.value=cfg[c.key];
        inp.addEventListener('input',()=>{ cfg[c.key]=parseFloat(inp.value); val.textContent=inp.value; });
        row.appendChild(inp);
      } else {
        row.appendChild(lab);
        const g=document.createElement('div'); g.className='seg-ctl';
        c.options.forEach(([t,v])=>{
          const b=document.createElement('button'); b.textContent=t;
          if(cfg[c.key]===v) b.classList.add('active');
          b.addEventListener('click',()=>{ cfg[c.key]=v; g.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b)); });
          g.appendChild(b);
        });
        row.appendChild(g);
      }
      root.appendChild(row);
    });
  }
})();
</script>
<script src="../nav.js" defer></script>
</body>
</html>
