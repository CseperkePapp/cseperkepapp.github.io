<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Serendipity — a study in scatter</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=Space+Mono&display=swap" rel="stylesheet" />
<style>
  :root{--paper:#efeae0;--ink:#1a1712;--dim:#8b8474;--acc:#c8632e}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--paper);color:var(--ink);font-family:"Fraunces",serif;overflow:hidden;
    display:flex;align-items:center;justify-content:center;text-align:center;-webkit-font-smoothing:antialiased}
  .bar{position:fixed;top:clamp(18px,3vw,34px);left:0;right:0;display:flex;justify-content:space-between;
    padding:0 clamp(18px,3vw,34px);font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--dim);z-index:3}
  .bar a{color:var(--dim);text-decoration:none;border-bottom:1px solid transparent;transition:.4s}
  .bar a:hover{color:var(--ink);border-color:var(--ink)}

  h1{font-weight:400;font-size:clamp(52px,15vw,220px);line-height:1;letter-spacing:-.01em;user-select:none;padding:0 4vw}
  h1 span{display:inline-block;will-change:transform,filter;cursor:pointer;
    transition:transform .8s cubic-bezier(.34,1.56,.64,1),filter .6s ease,opacity .6s ease,color .5s ease}

  .cap{position:fixed;left:0;right:0;bottom:clamp(22px,4vw,40px);text-align:center;font-style:italic;font-weight:300;
    color:var(--dim);font-size:clamp(14px,1.8vw,20px)}
  .cap b{font-style:normal;color:var(--acc);font-weight:400}
</style>
</head>
<body>
  <div class="bar">
    <span>05 · Scatter</span>
    <a href="../index.html">← Type Motion</a>
  </div>

  <h1 id="w" aria-label="serendipity"></h1>
  <p class="cap">Hover a letter to tickle it — or just watch. Every so often one <b>fidgets</b> on its own.</p>

<script>
(function(){
  const word='serendipity';
  const el=document.getElementById('w');
  const R=(a,b)=>a+Math.random()*(b-a);
  const letters=[];
  for(const ch of word){
    const s=document.createElement('span');
    s.textContent=ch; el.appendChild(s); letters.push(s);
  }

  function tumble(s,big){
    const rot=R(-1,1)*(big?46:20);
    const tx=R(-1,1)*(big?innerWidth*0.3:14);
    const ty=R(-1,1)*(big?160:16);
    const sc=big?R(0.2,1.5):R(0.86,1.28);
    s.style.transform=`translate(${tx.toFixed(0)}px,${ty.toFixed(0)}px) rotate(${rot.toFixed(1)}deg) scale(${sc.toFixed(2)})`;
    s.style.filter=big?'blur(7px)':'blur(.3px)';
    s.style.opacity=big?'0':'1';
    s.style.color='var(--acc)';
  }
  function settle(s){ s.style.transform='none'; s.style.filter='blur(0)'; s.style.opacity='1'; s.style.color=''; }

  // ---- assemble from chaos ----
  letters.forEach(s=>{ s.style.transition='none'; tumble(s,true); });
  void el.offsetWidth;                         // force reflow so the chaotic state is committed
  requestAnimationFrame(()=>{
    letters.forEach((s,i)=>{
      s.style.transition='';                   // restore CSS transition
      s.style.transitionDelay=R(0,.55).toFixed(2)+'s';
      settle(s);
    });
    setTimeout(()=>letters.forEach(s=>s.style.transitionDelay=''),1600);
    setTimeout(startFidget,1900);
  });

  // ---- occasional self-fidget ----
  const busy=new Set();
  function fidget(s){
    if(busy.has(s)) return;
    busy.add(s);
    tumble(s,false);
    setTimeout(()=>{ settle(s); busy.delete(s); },460);
  }
  function startFidget(){
    (function loop(){
      const s=letters[(Math.random()*letters.length)|0];
      fidget(s);
      setTimeout(loop, R(650,1500));
    })();
  }

  // ---- hover to tickle ----
  letters.forEach(s=>s.addEventListener('pointerenter',()=>fidget(s)));
})();
</script>
<script src="../nav.js" defer></script>
</body>
</html>
