<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fragility — a study in the breakable</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..500&family=Space+Mono&display=swap" rel="stylesheet" />
<style>
  :root{--paper:#ece7de;--ink:#26221c;--dim:#8b8474;--acc:#9c6b52;--line:rgba(38,34,28,.16);--on:#fff}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--paper);color:var(--ink);font-family:"Fraunces",serif;overflow:hidden;
    display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
  .bar{position:fixed;top:clamp(18px,3vw,34px);left:0;right:0;display:flex;justify-content:space-between;
    padding:0 clamp(18px,3vw,34px);font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--dim);z-index:3}
  .bar a{color:var(--dim);text-decoration:none;border-bottom:1px solid transparent;transition:.4s}
  .bar a:hover{color:var(--ink);border-color:var(--ink)}

  #shards{position:fixed;inset:0;z-index:2;pointer-events:none}
  .shard{position:fixed;display:inline-block;color:var(--ink);white-space:pre;will-change:transform,opacity}

  .word{font-weight:400;font-size:clamp(48px,14vw,220px);line-height:.9;letter-spacing:-.01em;user-select:none;z-index:1}
  .word .l{display:inline-block;cursor:pointer;transition:opacity .35s ease}

  .cap{position:fixed;left:0;right:0;bottom:clamp(22px,4vw,40px);text-align:center;font-style:italic;font-weight:300;
    color:var(--dim);font-size:clamp(14px,1.8vw,20px);z-index:3}
  .cap b{font-style:normal;color:var(--acc);font-weight:400}

  .panel{position:fixed;top:calc(clamp(18px,3vw,34px) + 32px);right:clamp(18px,3vw,34px);z-index:4;width:224px;
    font-family:"Space Mono",monospace;background:rgba(255,255,255,.5);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(6px)}
  .panel .head{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;cursor:pointer;
    font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
  .panel .head .tw{color:var(--ink)}
  .panel .body{padding:2px 13px 14px;display:flex;flex-direction:column;gap:13px}
  .panel.collapsed .body{display:none}
  .row{display:flex;flex-direction:column;gap:6px}
  .row label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between;gap:8px}
  .row label .val{color:var(--ink)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2px;background:var(--line);border-radius:2px;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--acc);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--acc);cursor:pointer}
  .seg-ctl{display:flex;gap:2px;border:1px solid var(--line);border-radius:20px;padding:2px}
  .seg-ctl button{flex:1;font-family:inherit;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
    background:transparent;border:0;padding:6px;border-radius:20px;cursor:pointer;transition:.3s}
  .seg-ctl button.active{background:var(--acc);color:var(--on)}
</style>
</head>
<body>
  <div class="bar"><span>Physical forces · Fragility</span><a href="../index.html">← Type Motion</a></div>

  <div id="shards"></div>
  <div class="word" id="word"></div>

  <p class="cap">The lightest touch and it <b>breaks</b> — then mends.</p>

  <div class="panel" id="panel">
    <div class="head" id="panelHead"><span>Parameters</span><span class="tw">tweak ▾</span></div>
    <div class="body" id="panelBody"></div>
  </div>

<script>
(function(){
  const cfg = {
    shards:     4,      // pieces per letter
    spread:     120,    // outward burst (px)
    gravity:    280,    // how far they fall (px)
    reassemble: 1600,   // ms before a letter mends
    trigger:    'hover',// 'hover' or 'click'
    auto:       false   // stress the word on its own
  };
  const fallMs=950;

  const wordEl=document.getElementById('word');
  const shardLayer=document.getElementById('shards');
  const word='fragile';
  const spans=[...word].map(ch=>{
    const s=document.createElement('span'); s.className='l'; s.textContent=ch; wordEl.appendChild(s);
    s.addEventListener('pointerenter',()=>{ if(cfg.trigger==='hover') shatter(s); });
    s.addEventListener('pointerdown',e=>{ if(cfg.trigger==='click'){ e.stopPropagation(); shatter(s); } });
    return s;
  });

  function perim(a){
    const c=Math.cos(a), s=Math.sin(a); let t=Infinity;
    if(c>1e-6) t=Math.min(t,50/c); if(c<-1e-6) t=Math.min(t,-50/c);
    if(s>1e-6) t=Math.min(t,50/s); if(s<-1e-6) t=Math.min(t,-50/s);
    return {x:50+c*t, y:50+s*t};
  }
  function shatter(el){
    if(el.dataset.broken) return;
    el.dataset.broken='1';
    const r=el.getBoundingClientRect(), cs=getComputedStyle(el), ch=el.textContent;
    const n=Math.max(2,Math.round(cfg.shards));
    const b=[]; const a0=Math.random()*Math.PI*2;
    for(let i=0;i<n;i++){ const a=a0 + (i/n)*Math.PI*2 + (Math.random()-.5)*0.5; b.push({a, p:perim(a)}); }
    for(let i=0;i<n;i++){
      const p1=b[i].p, p2=b[(i+1)%n].p;
      const sh=document.createElement('span'); sh.className='shard'; sh.textContent=ch;
      sh.style.font=cs.font; sh.style.fontWeight=cs.fontWeight; sh.style.fontStyle=cs.fontStyle;
      sh.style.left=r.left+'px'; sh.style.top=r.top+'px'; sh.style.width=r.width+'px'; sh.style.height=r.height+'px';
      sh.style.clipPath='polygon(50% 50%, '+p1.x.toFixed(1)+'% '+p1.y.toFixed(1)+'%, '+p2.x.toFixed(1)+'% '+p2.y.toFixed(1)+'%)';
      shardLayer.appendChild(sh);
      const mid=b[i].a + (Math.PI/n) + (Math.random()-.5)*0.3;   // outward direction of this wedge
      const dx=Math.cos(mid)*cfg.spread*(0.5+Math.random());
      const dy=Math.sin(mid)*cfg.spread*0.5 + cfg.gravity*(0.6+Math.random()*0.7);
      const rot=(Math.random()*2-1)*130;
      sh.animate([{transform:'translate(0,0) rotate(0deg)',opacity:1},
                  {transform:'translate('+dx.toFixed(0)+'px,'+dy.toFixed(0)+'px) rotate('+rot.toFixed(0)+'deg)',opacity:0}],
                 {duration:fallMs,easing:'cubic-bezier(.3,0,.7,1)',fill:'forwards'});
      setTimeout(()=>sh.remove(), fallMs+40);
    }
    el.style.opacity='0';
    setTimeout(()=>{ el.style.opacity='1'; el.dataset.broken=''; }, cfg.reassemble);
  }

  setInterval(()=>{ if(cfg.auto){ const av=spans.filter(s=>!s.dataset.broken); if(av.length) shatter(av[(Math.random()*av.length)|0]); } }, 850);

  const spec=[
    {type:'range', key:'shards',     label:'Shards',     min:2,  max:8,   step:1},
    {type:'range', key:'spread',     label:'Burst',      min:40, max:320, step:10},
    {type:'range', key:'gravity',    label:'Fall',       min:80, max:600, step:20},
    {type:'range', key:'reassemble', label:'Mend delay', min:400,max:4000,step:100},
    {type:'toggle',key:'trigger',    label:'Trigger',    options:[['hover','hover'],['click','click']]},
    {type:'toggle',key:'auto',       label:'Auto-stress',options:[['off',false],['on',true]]}
  ];
  buildPanel(document.getElementById('panelBody'), spec, cfg);
  const panel=document.getElementById('panel');
  document.getElementById('panelHead').addEventListener('click',()=>panel.classList.toggle('collapsed'));

  function buildPanel(root, spec, cfg){
    spec.forEach(c=>{
      const row=document.createElement('div'); row.className='row';
      const lab=document.createElement('label'); lab.textContent=c.label;
      if(c.type==='range'){
        const val=document.createElement('span'); val.className='val'; val.textContent=cfg[c.key];
        lab.appendChild(val); row.appendChild(lab);
        const inp=document.createElement('input'); inp.type='range';
        inp.min=c.min; inp.max=c.max; inp.step=c.step; inp.value=cfg[c.key];
        inp.addEventListener('input',()=>{ cfg[c.key]=parseFloat(inp.value); val.textContent=inp.value; });
        row.appendChild(inp);
      } else {
        row.appendChild(lab);
        const g=document.createElement('div'); g.className='seg-ctl';
        c.options.forEach(([t,v])=>{
          const b=document.createElement('button'); b.textContent=t;
          if(cfg[c.key]===v) b.classList.add('active');
          b.addEventListener('click',()=>{ cfg[c.key]=v; g.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b)); });
          g.appendChild(b);
        });
        row.appendChild(g);
      }
      root.appendChild(row);
    });
  }
})();
</script>
</body>
</html>
