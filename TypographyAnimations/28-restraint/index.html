<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Restraint — a study in the held</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Space+Mono&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#12130f;--ink:#eceadf;--dim:#84837a;--acc:#cf8f3a;--bind:#e0473a;--line:rgba(236,234,223,.16);--on:#12130f}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Fraunces",serif;overflow:hidden;
    display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
  .bar{position:fixed;top:clamp(18px,3vw,34px);left:0;right:0;display:flex;justify-content:space-between;
    padding:0 clamp(18px,3vw,34px);font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--dim);z-index:3}
  .bar a{color:var(--dim);text-decoration:none;border-bottom:1px solid transparent;transition:.4s}
  .bar a:hover{color:var(--ink);border-color:var(--ink)}

  svg.tether{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;overflow:visible}
  svg#tethers{z-index:1}   /* rails + half the corner lines — behind the word */
  svg#tf{z-index:3}        /* pins, dots + the other half of the corner lines — in front */
  .word{position:relative;z-index:2;font-weight:400;font-size:clamp(48px,13vw,200px);line-height:.9;letter-spacing:-.01em;user-select:none;
    transform-origin:center center;will-change:transform,font-variation-settings;font-variation-settings:"wght" 340}
  .word span{display:inline-block}

  .cap{position:fixed;left:0;right:0;bottom:clamp(22px,4vw,40px);text-align:center;font-style:italic;font-weight:300;
    color:var(--dim);font-size:clamp(14px,1.8vw,20px);z-index:3}
  .cap b{font-style:normal;color:var(--bind);font-weight:400}

  .panel{position:fixed;top:calc(clamp(18px,3vw,34px) + 32px);right:clamp(18px,3vw,34px);z-index:4;width:224px;
    font-family:"Space Mono",monospace;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(6px)}
  .panel .head{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;cursor:pointer;
    font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
  .panel .head .tw{color:var(--ink)}
  .panel .body{padding:2px 13px 14px;display:flex;flex-direction:column;gap:13px}
  .panel.collapsed .body{display:none}
  .row{display:flex;flex-direction:column;gap:6px}
  .row label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between;gap:8px}
  .row label .val{color:var(--ink)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2px;background:var(--line);border-radius:2px;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--acc);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--acc);cursor:pointer}
  .seg-ctl{display:flex;gap:2px;border:1px solid var(--line);border-radius:20px;padding:2px}
  .seg-ctl button{flex:1;font-family:inherit;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
    background:transparent;border:0;padding:6px;border-radius:20px;cursor:pointer;transition:.3s}
  .seg-ctl button.active{background:var(--acc);color:var(--on)}
</style>
</head>
<body>
  <div class="bar"><span>Inner states · Restraint</span><a href="../index.html">← Type Motion</a></div>

  <svg id="tethers" class="tether"></svg>
  <div class="word" id="word"></div>
  <svg id="tf" class="tether"></svg>

  <p class="cap">It strains against its <b>bindings</b> — and moves not an inch.</p>

  <div class="panel" id="panel">
    <div class="head" id="panelHead"><span>Parameters</span><span class="tw">tweak ▾</span></div>
    <div class="body" id="panelBody"></div>
  </div>

<script>
(function(){
  const cfg = {
    urge:    420,   // how badly it wants to move (px it would travel unrestrained)
    limit:   22,    // how far it permits itself (px) — the restraint
    quiver:  3.5,   // the tremor of contained effort
    pulse:   0.7,   // how often the urge surges
    tethers: true   // the red bindings
  };
  const INK=[236,234,223], HOT=[207,143,58];

  const wordEl=document.getElementById('word'), svgB=document.getElementById('tethers'), svgF=document.getElementById('tf');
  const spans=[...'restraint'].map(ch=>{ const s=document.createElement('span'); s.textContent=ch; wordEl.appendChild(s); return {el:s}; });

  const mkLine=svg=>{ const l=document.createElementNS('http://www.w3.org/2000/svg','line'); l.setAttribute('stroke','var(--bind)'); l.setAttribute('stroke-linecap','round'); svg.appendChild(l); return l; };
  const mkDot =svg=>{ const c=document.createElementNS('http://www.w3.org/2000/svg','circle'); c.setAttribute('fill','var(--bind)'); svg.appendChild(c); return c; };

  // ---- corner tethers: each letter to a different corner, gripping its own facing corner ----
  spans.forEach((o,i)=>{ o.line=mkLine(i%2===0?svgB:svgF); o.dot=mkDot(svgF); });
  function cornerDefs(){ const s=46,W=innerWidth,H=innerHeight;
    return [{a:[s,s],fx:0,fy:0},{a:[W-s,s],fx:1,fy:0},{a:[W-s,H-s],fx:1,fy:1},{a:[s,H-s],fx:0,fy:1}]; }
  function layoutCorners(){ const d=cornerDefs(); spans.forEach((o,i)=>{ const c=d[i%4]; o.anchor=c.a; o.fx=c.fx; o.fy=c.fy; }); }
  layoutCorners(); addEventListener('resize',layoutCorners);

  // ---- two parallel rails behind the word + pins ----
  const rail1=mkLine(svgB), rail2=mkLine(svgB);
  const pins=[mkDot(svgF),mkDot(svgF),mkDot(svgF),mkDot(svgF)];

  function frame(now){
    const t=now/1000;
    const target=Math.sin(t*cfg.pulse*Math.PI)*cfg.urge;
    const held=Math.max(-cfg.limit,Math.min(cfg.limit,target));
    const contained=Math.min(1,(Math.abs(target)-Math.abs(held))/Math.max(1,cfg.urge));
    const q=(Math.random()*2-1)*cfg.quiver*contained;
    wordEl.style.transform='translateX('+(held+q).toFixed(2)+'px)';
    wordEl.style.fontVariationSettings='"wght" '+(320+contained*400).toFixed(0);
    const col=INK.map((v,i)=>Math.round(v+(HOT[i]-v)*contained*0.8));
    wordEl.style.color='rgb('+col[0]+','+col[1]+','+col[2]+')';

    if(cfg.tethers){
      svgB.style.display='block'; svgF.style.display='block';
      const lw=(1.4+contained*2).toFixed(2), lo=(0.5+contained*0.4).toFixed(2), dr=(4+contained*2.5).toFixed(1);
      // corner tethers
      for(const o of spans){
        const r=o.el.getBoundingClientRect();
        const bx=o.fx?r.right:r.left, by=o.fy?r.bottom:r.top;
        const cx=bx+(r.left+r.width/2-bx)*0.28, cy=by+(r.top+r.height/2-by)*0.28;
        o.line.setAttribute('x1',o.anchor[0]); o.line.setAttribute('y1',o.anchor[1]);
        o.line.setAttribute('x2',cx.toFixed(1)); o.line.setAttribute('y2',cy.toFixed(1));
        o.line.setAttribute('stroke-width',lw); o.line.setAttribute('opacity',lo);
        o.dot.setAttribute('cx',cx.toFixed(1)); o.dot.setAttribute('cy',cy.toFixed(1)); o.dot.setAttribute('r',dr);
      }
      // two rails
      const wr=wordEl.getBoundingClientRect(), W=innerWidth;
      const y1=wr.top+wr.height*0.36, y2=wr.top+wr.height*0.64;
      const sw=(1.8+contained*2.6).toFixed(2), pr=(5+contained*3.5).toFixed(1);
      rail1.setAttribute('x1',0); rail1.setAttribute('y1',y1.toFixed(1)); rail1.setAttribute('x2',W); rail1.setAttribute('y2',y1.toFixed(1)); rail1.setAttribute('stroke-width',sw); rail1.setAttribute('opacity',lo);
      rail2.setAttribute('x1',0); rail2.setAttribute('y1',y2.toFixed(1)); rail2.setAttribute('x2',W); rail2.setAttribute('y2',y2.toFixed(1)); rail2.setAttribute('stroke-width',sw); rail2.setAttribute('opacity',lo);
      const pp=[[wr.left,y1],[wr.right,y1],[wr.left,y2],[wr.right,y2]];
      pins.forEach((d,i)=>{ d.setAttribute('cx',pp[i][0].toFixed(1)); d.setAttribute('cy',pp[i][1].toFixed(1)); d.setAttribute('r',pr); });
    } else { svgB.style.display='none'; svgF.style.display='none'; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  const spec=[
    {type:'range', key:'urge',   label:'Urge',      min:60, max:800,step:20},
    {type:'range', key:'limit',  label:'Allowed',   min:2,  max:120,step:2},
    {type:'range', key:'quiver', label:'Quiver',    min:0,  max:10, step:.5},
    {type:'range', key:'pulse',  label:'Surge rate',min:.2, max:3,  step:.1},
    {type:'toggle',key:'tethers',label:'Bindings',  options:[['off',false],['on',true]]}
  ];
  buildPanel(document.getElementById('panelBody'), spec, cfg);
  const panel=document.getElementById('panel');
  document.getElementById('panelHead').addEventListener('click',()=>panel.classList.toggle('collapsed'));

  function buildPanel(root, spec, cfg){
    spec.forEach(c=>{
      const row=document.createElement('div'); row.className='row';
      const lab=document.createElement('label'); lab.textContent=c.label;
      if(c.type==='range'){
        const val=document.createElement('span'); val.className='val'; val.textContent=cfg[c.key];
        lab.appendChild(val); row.appendChild(lab);
        const inp=document.createElement('input'); inp.type='range';
        inp.min=c.min; inp.max=c.max; inp.step=c.step; inp.value=cfg[c.key];
        inp.addEventListener('input',()=>{ cfg[c.key]=parseFloat(inp.value); val.textContent=inp.value; });
        row.appendChild(inp);
      } else {
        row.appendChild(lab);
        const g=document.createElement('div'); g.className='seg-ctl';
        c.options.forEach(([t,v])=>{
          const b=document.createElement('button'); b.textContent=t;
          if(cfg[c.key]===v) b.classList.add('active');
          b.addEventListener('click',()=>{ cfg[c.key]=v; g.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b)); });
          g.appendChild(b);
        });
        row.appendChild(g);
      }
      root.appendChild(row);
    });
  }
})();
</script>
</body>
</html>
