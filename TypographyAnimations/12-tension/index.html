<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tension — a study in the taut</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=Space+Mono&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#101418;--ink:#eef2f4;--dim:#7c848c;--acc:#46d6c0;--line:rgba(238,242,244,.16);--on:#101418}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Fraunces",serif;overflow:hidden;
    display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
  .bar{position:fixed;top:clamp(18px,3vw,34px);left:0;right:0;display:flex;justify-content:space-between;
    padding:0 clamp(18px,3vw,34px);font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--dim);z-index:3}
  .bar a{color:var(--dim);text-decoration:none;border-bottom:1px solid transparent;transition:.4s}
  .bar a:hover{color:var(--ink);border-color:var(--ink)}

  .stringwrap{position:relative;display:inline-block;user-select:none}
  svg.string{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
  .word{position:relative;display:flex;font-weight:400;font-size:clamp(46px,12vw,180px);line-height:.9;letter-spacing:-.01em}
  .word span{display:inline-block;will-change:transform}

  .cap{position:fixed;left:0;right:0;bottom:clamp(22px,4vw,40px);text-align:center;font-style:italic;font-weight:300;
    color:var(--dim);font-size:clamp(14px,1.8vw,20px)}
  .cap b{font-style:normal;color:var(--acc);font-weight:400}

  .panel{position:fixed;top:calc(clamp(18px,3vw,34px) + 32px);right:clamp(18px,3vw,34px);z-index:4;width:224px;
    font-family:"Space Mono",monospace;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(6px)}
  .panel .head{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;cursor:pointer;
    font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
  .panel .head .tw{color:var(--ink)}
  .panel .body{padding:2px 13px 14px;display:flex;flex-direction:column;gap:13px}
  .panel.collapsed .body{display:none}
  .row{display:flex;flex-direction:column;gap:6px}
  .row label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between;gap:8px}
  .row label .val{color:var(--ink)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2px;background:var(--line);border-radius:2px;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--acc);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--acc);cursor:pointer}
  .seg{display:flex;gap:2px;border:1px solid var(--line);border-radius:20px;padding:2px}
  .seg button{flex:1;font-family:inherit;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
    background:transparent;border:0;padding:6px;border-radius:20px;cursor:pointer;transition:.3s}
  .seg button.active{background:var(--acc);color:var(--on)}
</style>
</head>
<body>
  <div class="bar"><span>Physical forces · Tension</span><a href="../index.html">← Type Motion</a></div>

  <div class="stringwrap">
    <svg class="string" id="svg"><polyline id="poly" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/></svg>
    <div class="word" id="word"></div>
  </div>

  <p class="cap"><b>Pluck it</b> — a click sets the taut line ringing.</p>

  <div class="panel" id="panel">
    <div class="head" id="panelHead"><span>Parameters</span><span class="tw">tweak ▾</span></div>
    <div class="body" id="panelBody"></div>
  </div>

<script>
(function(){
  const cfg = {
    tension:  16,    // vibration speed (ω) — higher = tighter, faster ring
    damping:  1.8,   // how quickly the ring fades
    pluck:    64,    // pluck amplitude (px)
    autoPluck:false  // pluck itself now and then
  };

  const wordEl=document.getElementById('word');
  const svg=document.getElementById('svg');
  const poly=document.getElementById('poly');
  const word='tension';
  const spans=[...word].map(ch=>{ const s=document.createElement('span'); s.textContent=ch; wordEl.appendChild(s); return s; });
  const N=spans.length;

  let centers=[], baseY=0, W=0, H=0;
  function measure(){
    centers=spans.map(s=>s.offsetLeft + s.offsetWidth/2);
    W=wordEl.offsetWidth; H=wordEl.offsetHeight;
    baseY=H*0.9;
    svg.setAttribute('width', W); svg.setAttribute('height', H);
  }
  (document.fonts?document.fonts.ready:Promise.resolve()).then(()=>setTimeout(measure,60));
  setTimeout(measure,400); addEventListener('resize',measure);

  let amp=0, t0=performance.now();
  function waveAt(t, now){                       // t in [0,1]
    const age=(now-t0)/1000;
    const env=Math.sin(Math.PI*t);               // fundamental: pinned at both ends
    return amp*env*Math.cos(cfg.tension*age)*Math.exp(-cfg.damping*age);
  }
  function frame(now){
    // letters ride the wave
    for(let i=0;i<N;i++){
      const t=N>1? i/(N-1):.5;
      spans[i].style.transform='translateY('+waveAt(t,now).toFixed(2)+'px)';
    }
    // string samples the same wave continuously, pinned to side anchors
    if(centers.length){
      let pts='-24,'+baseY+' ';
      const S=48;
      for(let k=0;k<=S;k++){
        const t=k/S, x=t*W, y=baseY+waveAt(t,now);
        pts+=x.toFixed(1)+','+y.toFixed(1)+' ';
      }
      pts+=(W+24)+','+baseY;
      poly.setAttribute('points',pts);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function pluck(dir){ amp=dir*cfg.pluck; t0=performance.now(); }
  addEventListener('pointerdown', e=>{
    if(e.target.closest('.panel')) return;
    pluck(e.clientY < innerHeight/2 ? -1 : 1);
  });
  setInterval(()=>{ if(cfg.autoPluck) pluck(Math.random()<.5?-1:1); }, 2600);

  const spec=[
    {type:'range', key:'tension', label:'Tension (ω)',min:4,  max:44, step:1},
    {type:'range', key:'damping', label:'Damping',    min:.2, max:6,  step:.1},
    {type:'range', key:'pluck',   label:'Pluck force',min:10, max:150,step:2},
    {type:'toggle',key:'autoPluck',label:'Auto-pluck',options:[['off',false],['on',true]]}
  ];
  buildPanel(document.getElementById('panelBody'), spec, cfg);
  const panel=document.getElementById('panel');
  document.getElementById('panelHead').addEventListener('click',()=>panel.classList.toggle('collapsed'));

  function buildPanel(root, spec, cfg){
    spec.forEach(c=>{
      const row=document.createElement('div'); row.className='row';
      const lab=document.createElement('label'); lab.textContent=c.label;
      if(c.type==='range'){
        const val=document.createElement('span'); val.className='val'; val.textContent=cfg[c.key];
        lab.appendChild(val); row.appendChild(lab);
        const inp=document.createElement('input'); inp.type='range';
        inp.min=c.min; inp.max=c.max; inp.step=c.step; inp.value=cfg[c.key];
        inp.addEventListener('input',()=>{ cfg[c.key]=parseFloat(inp.value); val.textContent=inp.value; });
        row.appendChild(inp);
      } else {
        row.appendChild(lab);
        const g=document.createElement('div'); g.className='seg';
        c.options.forEach(([t,v])=>{
          const b=document.createElement('button'); b.textContent=t;
          if(cfg[c.key]===v) b.classList.add('active');
          b.addEventListener('click',()=>{ cfg[c.key]=v; g.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b)); });
          g.appendChild(b);
        });
        row.appendChild(g);
      }
      root.appendChild(row);
    });
  }
})();
</script>
</body>
</html>
