<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Courage — a study in the leap</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..800&family=Space+Mono&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#16110f;--ink:#f2e9e0;--dim:#8b8175;--acc:#e0673a;--line:rgba(242,233,224,.16);--on:#16110f}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Fraunces",serif;overflow:hidden;
    display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased;cursor:pointer}
  .bar{position:fixed;top:clamp(18px,3vw,34px);left:0;right:0;display:flex;justify-content:space-between;
    padding:0 clamp(18px,3vw,34px);font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--dim);z-index:3}
  .bar a{color:var(--dim);text-decoration:none;border-bottom:1px solid transparent;transition:.4s}
  .bar a:hover{color:var(--ink);border-color:var(--ink)}

  .edge{position:fixed;top:24%;bottom:24%;width:2px;background:repeating-linear-gradient(var(--acc),var(--acc) 6px,transparent 6px,transparent 12px);opacity:.5;z-index:1}
  .word{position:relative;z-index:2;font-weight:500;font-size:clamp(50px,14vw,210px);line-height:.9;letter-spacing:-.01em;
    user-select:none;transform-origin:bottom center;will-change:transform,font-variation-settings;font-variation-settings:"wght" 460}

  .cap{position:fixed;left:0;right:0;bottom:clamp(22px,4vw,40px);text-align:center;font-style:italic;font-weight:400;
    color:var(--dim);font-size:clamp(14px,1.8vw,20px);z-index:3}
  .cap b{font-style:normal;color:var(--acc);font-weight:600}

  .panel{position:fixed;top:calc(clamp(18px,3vw,34px) + 32px);right:clamp(18px,3vw,34px);z-index:4;width:224px;
    font-family:"Space Mono",monospace;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(6px)}
  .panel .head{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;cursor:pointer;
    font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
  .panel .head .tw{color:var(--ink)}
  .panel .body{padding:2px 13px 14px;display:flex;flex-direction:column;gap:13px}
  .panel.collapsed .body{display:none}
  .row{display:flex;flex-direction:column;gap:6px}
  .row label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between;gap:8px}
  .row label .val{color:var(--ink)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2px;background:var(--line);border-radius:2px;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--acc);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--acc);cursor:pointer}
  .seg-ctl{display:flex;gap:2px;border:1px solid var(--line);border-radius:20px;padding:2px}
  .seg-ctl button{flex:1;font-family:inherit;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
    background:transparent;border:0;padding:6px;border-radius:20px;cursor:pointer;transition:.3s}
  .seg-ctl button.active{background:var(--acc);color:var(--on)}
</style>
</head>
<body>
  <div class="bar"><span>Inner states · Courage</span><a href="../index.html">← Type Motion</a></div>

  <div class="edge" id="edge"></div>
  <div class="word" id="word">courage</div>

  <p class="cap">It falters at the brink — then <b>leaps</b>.</p>

  <div class="panel" id="panel">
    <div class="head" id="panelHead"><span>Parameters</span><span class="tw">tweak ▾</span></div>
    <div class="body" id="panelBody"></div>
  </div>

<script>
(function(){
  const cfg = {
    hesitation: 1800,  // ms of faltering before it goes
    commit:     240,   // how far it leaps (px)
    boldness:   300,   // added weight at full courage
    auto:       true   // commit on its own, or wait for a click
  };

  const word=document.getElementById('word'), edge=document.getElementById('edge');
  function place(){ edge.style.left=(innerWidth/2 + word.offsetWidth/2 + 20)+'px'; }
  (document.fonts?document.fonts.ready:Promise.resolve()).then(()=>setTimeout(place,60));
  setTimeout(place,400); addEventListener('resize',place);

  const expo=t=> t>=1?1:1-Math.pow(2,-10*t);
  const io  =t=> t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  let phase='wait', t0=performance.now();

  function frame(now){
    const el=word;
    let x=0, s=1, w=0, rot=0;
    if(phase==='wait'){
      const p=Math.min(1,(now-t0)/cfg.hesitation);          // resolve building
      x=-(2+p*7)*Math.abs(Math.sin(now/95));                // nervous shrink-back at the edge
      rot=-p*2.2*Math.abs(Math.sin(now/140));
      w=p*70;
      if(cfg.auto && now-t0>=cfg.hesitation){ phase='commit'; t0=now; }
    } else if(phase==='commit'){
      const t=(now-t0)/360;
      x = expo(Math.min(1,t))*cfg.commit;
      s = 1+0.06*expo(Math.min(1,t));
      w = cfg.boldness;
      if(t>=1){ phase='hold'; t0=now; }
    } else if(phase==='hold'){
      x=cfg.commit; s=1.06; w=cfg.boldness;
      if(now-t0>650){ phase='retreat'; t0=now; }
    } else { // retreat
      const t=Math.min(1,(now-t0)/1000);
      x=cfg.commit*(1-io(t)); s=1+0.06*(1-t); w=cfg.boldness*(1-t);
      if(t>=1){ phase='wait'; t0=now; }
    }
    const committing = phase==='commit'||phase==='hold';
    el.style.transform='translateX('+x.toFixed(1)+'px) scale('+s.toFixed(3)+') rotate('+rot.toFixed(2)+'deg)';
    el.style.fontVariationSettings='"wght" '+(460+w).toFixed(0);
    el.style.color = committing ? 'var(--acc)' : 'var(--ink)';
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  addEventListener('pointerdown', e=>{ if(e.target.closest('.panel')) return; if(phase==='wait'){ phase='commit'; t0=performance.now(); } });

  const spec=[
    {type:'range', key:'hesitation',label:'Hesitation', min:400,max:4000,step:100},
    {type:'range', key:'commit',    label:'Leap',       min:60, max:500, step:10},
    {type:'range', key:'boldness',  label:'Boldness',   min:0,  max:440, step:10},
    {type:'toggle',key:'auto',      label:'Auto-commit',options:[['off',false],['on',true]]}
  ];
  buildPanel(document.getElementById('panelBody'), spec, cfg);
  const panel=document.getElementById('panel');
  document.getElementById('panelHead').addEventListener('click',()=>panel.classList.toggle('collapsed'));

  function buildPanel(root, spec, cfg){
    spec.forEach(c=>{
      const row=document.createElement('div'); row.className='row';
      const lab=document.createElement('label'); lab.textContent=c.label;
      if(c.type==='range'){
        const val=document.createElement('span'); val.className='val'; val.textContent=cfg[c.key];
        lab.appendChild(val); row.appendChild(lab);
        const inp=document.createElement('input'); inp.type='range';
        inp.min=c.min; inp.max=c.max; inp.step=c.step; inp.value=cfg[c.key];
        inp.addEventListener('input',()=>{ cfg[c.key]=parseFloat(inp.value); val.textContent=inp.value; });
        row.appendChild(inp);
      } else {
        row.appendChild(lab);
        const g=document.createElement('div'); g.className='seg-ctl';
        c.options.forEach(([t,v])=>{
          const b=document.createElement('button'); b.textContent=t;
          if(cfg[c.key]===v) b.classList.add('active');
          b.addEventListener('click',()=>{ cfg[c.key]=v; g.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b)); });
          g.appendChild(b);
        });
        row.appendChild(g);
      }
      root.appendChild(row);
    });
  }
})();
</script>
</body>
</html>
