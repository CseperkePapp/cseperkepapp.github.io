<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Balance — a study in equilibrium</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..500&family=Space+Mono&display=swap" rel="stylesheet" />
<style>
  :root{--paper:#efeae0;--ink:#1a1712;--dim:#8b8474;--acc:#c8632e;--line:rgba(26,23,18,.16);--on:#fff}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--paper);color:var(--ink);font-family:"Fraunces",serif;overflow:hidden;
    display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
  .bar{position:fixed;top:clamp(18px,3vw,34px);left:0;right:0;display:flex;justify-content:space-between;
    padding:0 clamp(18px,3vw,34px);font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--dim);z-index:3}
  .bar a{color:var(--dim);text-decoration:none;border-bottom:1px solid transparent;transition:.4s}
  .bar a:hover{color:var(--ink);border-color:var(--ink)}

  #rain{position:fixed;inset:0;z-index:1;pointer-events:none}
  .drop{position:absolute;left:0;top:0;width:0;height:0;will-change:transform}

  .scene{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;user-select:none;margin-top:-4vh}
  .seg{display:flex;flex-direction:column;align-items:center;transform-origin:bottom center;will-change:transform}
  .word{font-weight:400;font-size:clamp(40px,10.5vw,168px);line-height:.9;letter-spacing:-.01em;margin-bottom:.14em}
  .tri{width:0;height:0;margin-top:1px}
  .tri.up{border-left:21px solid transparent;border-right:21px solid transparent;border-bottom:31px solid var(--acc)}
  .tri.down{border-left:21px solid transparent;border-right:21px solid transparent;border-top:31px solid var(--ink)}
  .ground{width:min(560px,82vw);height:2px;background:rgba(26,23,18,.18);margin-top:4px}

  .cap{position:fixed;left:0;right:0;bottom:clamp(22px,4vw,40px);text-align:center;font-style:italic;font-weight:300;
    color:var(--dim);font-size:clamp(14px,1.8vw,20px);z-index:3}
  .cap b{font-style:normal;color:var(--acc);font-weight:400}

  .panel{position:fixed;top:calc(clamp(18px,3vw,34px) + 32px);right:clamp(18px,3vw,34px);z-index:4;width:224px;
    font-family:"Space Mono",monospace;background:rgba(255,255,255,.5);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(6px)}
  .panel .head{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;cursor:pointer;
    font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
  .panel .head .tw{color:var(--ink)}
  .panel .body{padding:2px 13px 14px;display:flex;flex-direction:column;gap:13px}
  .panel.collapsed .body{display:none}
  .row{display:flex;flex-direction:column;gap:6px}
  .row label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between;gap:8px}
  .row label .val{color:var(--ink)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2px;background:var(--line);border-radius:2px;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--acc);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--acc);cursor:pointer}
  .seg-ctl{display:flex;gap:2px;border:1px solid var(--line);border-radius:20px;padding:2px}
  .seg-ctl button{flex:1;font-family:inherit;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
    background:transparent;border:0;padding:6px;border-radius:20px;cursor:pointer;transition:.3s}
  .seg-ctl button.active{background:var(--acc);color:var(--on)}
</style>
</head>
<body>
  <div class="bar"><span>Physical forces · Balance</span><a href="../index.html">← Type Motion</a></div>

  <div id="rain"></div>

  <div class="scene">
    <div class="seg" id="s1">
      <div class="seg" id="s2">
        <div class="word" id="word">balance</div>
        <span class="tri down"></span>
      </div>
      <span class="tri up"></span>
    </div>
    <div class="ground"></div>
  </div>

  <p class="cap">It comes to rest — <b>until the next triangle falls</b>.</p>

  <div class="panel" id="panel">
    <div class="head" id="panelHead"><span>Parameters</span><span class="tw">tweak ▾</span></div>
    <div class="body" id="panelBody"></div>
  </div>

<script>
(function(){
  // ---------- tweakable config ----------
  const cfg = {
    stiffness: 30,     // restoring strength — it does find rest
    damping:   3.2,    // how quickly the wobble dies away
    impact:    2.6,    // knock delivered by each landing triangle
    rainRate:  0.6,    // triangles per second (higher = more often)
    fallSpeed: 520,    // initial fall speed (px/s)
    rain:      true
  };

  // ---------- the balance (damped, settles to level) ----------
  const segs=[document.getElementById('s1'),document.getElementById('s2')];
  const wordEl=document.getElementById('word');
  const fm=[1.0,1.34]; const N=segs.length;
  let th=[0.02,-0.015], w=[0,0], last=performance.now();

  let CX=0, YI=0, MW=400;
  function measure(){ const r=wordEl.getBoundingClientRect(); MW=wordEl.offsetWidth; CX=innerWidth/2; YI=r.top+wordEl.offsetHeight*0.45; }
  (document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{ measure(); nextSpawn=performance.now()+500; });
  setTimeout(measure,400); addEventListener('resize',measure);

  // ---------- the rain ----------
  const rain=document.getElementById('rain');
  const drops=[]; let nextSpawn=Infinity;
  function spawn(){
    const s=9+Math.random()*9, up=Math.random()<.5;
    const el=document.createElement('div'); el.className='drop';
    el.style.borderLeft=s+'px solid transparent';
    el.style.borderRight=s+'px solid transparent';
    el.style[up?'borderBottom':'borderTop']=(s*1.5)+'px solid var(--acc)';
    rain.appendChild(el);
    drops.push({el, x:CX+(Math.random()*2-1)*MW*0.72, y:-30,
                vy:cfg.fallSpeed*(0.6+Math.random()*0.5), rot:Math.random()*360, vr:(Math.random()*2-1)*160, hit:false});
  }

  function frame(now){
    let dt=Math.min((now-last)/1000,.032); last=now;

    // balance integration (damped spring, mild coupling)
    for(let s=0;s<2;s++){ const h=dt/2;
      for(let i=0;i<N;i++){
        const acc = -cfg.stiffness*fm[i]*th[i] - cfg.damping*w[i] + 0.4*((i>0?th[i-1]:0)-th[i]);
        w[i]+=acc*h; th[i]+=w[i]*h;
        th[i]=Math.max(-.6,Math.min(.6,th[i]));
      }
    }
    for(let i=0;i<N;i++) segs[i].style.transform='rotate('+(th[i]*57.2958).toFixed(3)+'deg)';

    // rain
    if(cfg.rain && now>=nextSpawn){ spawn(); nextSpawn=now+(1000/cfg.rainRate)*(0.5+Math.random()); }
    for(let k=drops.length-1;k>=0;k--){
      const d=drops[k];
      d.vy+=1000*dt; d.y+=d.vy*dt; d.rot+=d.vr*dt;
      d.el.style.transform='translate('+d.x.toFixed(1)+'px,'+d.y.toFixed(1)+'px) rotate('+d.rot.toFixed(1)+'deg)';
      if(!d.hit && d.y>=YI && Math.abs(d.x-CX)<MW*0.5+26){
        d.hit=true;
        const off=Math.max(-1,Math.min(1,(d.x-CX)/(MW*0.5+26)));
        w[0]+=off*cfg.impact; w[1]+=off*cfg.impact*0.6;
        d.el.remove(); drops.splice(k,1); continue;
      }
      if(d.y>innerHeight+50){ d.el.remove(); drops.splice(k,1); }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  addEventListener('pointerdown', e=>{
    if(e.target.closest('.panel')) return;
    const dir=e.clientX<innerWidth/2?-1:1;
    w[0]+=dir*2.4; w[1]+=dir*1.4;
  });

  // ---------- controls ----------
  const spec=[
    {type:'range', key:'stiffness',label:'Stiffness', min:8,  max:80,  step:1},
    {type:'range', key:'damping',  label:'Damping',   min:.5, max:8,   step:.1},
    {type:'range', key:'impact',   label:'Impact',    min:.5, max:6,   step:.1},
    {type:'range', key:'rainRate', label:'Rain rate',  min:.1, max:6,   step:.1},
    {type:'range', key:'fallSpeed',label:'Fall speed',min:200,max:1100,step:20},
    {type:'toggle',key:'rain',     label:'Rain',      options:[['off',false],['on',true]]}
  ];
  buildPanel(document.getElementById('panelBody'), spec, cfg);
  const panel=document.getElementById('panel');
  document.getElementById('panelHead').addEventListener('click',()=>panel.classList.toggle('collapsed'));

  function buildPanel(root, spec, cfg){
    spec.forEach(c=>{
      const row=document.createElement('div'); row.className='row';
      const lab=document.createElement('label'); lab.textContent=c.label;
      if(c.type==='range'){
        const val=document.createElement('span'); val.className='val'; val.textContent=cfg[c.key];
        lab.appendChild(val); row.appendChild(lab);
        const inp=document.createElement('input'); inp.type='range';
        inp.min=c.min; inp.max=c.max; inp.step=c.step; inp.value=cfg[c.key];
        inp.addEventListener('input',()=>{ cfg[c.key]=parseFloat(inp.value); val.textContent=inp.value; });
        row.appendChild(inp);
      } else {
        row.appendChild(lab);
        const g=document.createElement('div'); g.className='seg-ctl';
        c.options.forEach(([t,v])=>{
          const b=document.createElement('button'); b.textContent=t;
          if(cfg[c.key]===v) b.classList.add('active');
          b.addEventListener('click',()=>{ cfg[c.key]=v; g.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b)); });
          g.appendChild(b);
        });
        row.appendChild(g);
      }
      root.appendChild(row);
    });
  }
})();
</script>
<script src="../nav.js" defer></script>
</body>
</html>
