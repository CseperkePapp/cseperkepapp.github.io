<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Closer — a study in proximity</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,200..800&family=Space+Mono&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#14141a;--ink:#efe9dd;--dim:#7d7a72;--acc:#c9a24a}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Fraunces",serif;overflow:hidden;
    display:flex;align-items:center;justify-content:center;text-align:center;-webkit-font-smoothing:antialiased;cursor:none}
  .bar{position:fixed;top:clamp(18px,3vw,34px);left:0;right:0;display:flex;justify-content:space-between;
    padding:0 clamp(18px,3vw,34px);font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--dim)}
  .bar a{color:var(--dim);text-decoration:none;border-bottom:1px solid transparent;transition:.4s}
  .bar a:hover{color:var(--ink);border-color:var(--ink)}

  #stage{max-width:92vw;font-weight:300;font-size:clamp(44px,10vw,150px);line-height:1.04;letter-spacing:-.01em;user-select:none}
  .word{display:inline-block;white-space:nowrap;margin:0 .18em}
  .word span{display:inline-block;will-change:transform;font-variation-settings:"opsz" 120,"wght" 300}

  .cap{position:fixed;left:0;right:0;bottom:clamp(22px,4vw,40px);text-align:center;font-style:italic;font-weight:300;
    color:var(--dim);font-size:clamp(14px,1.8vw,20px);opacity:0;animation:fade 1.6s 1s forwards}
  @keyframes fade{to{opacity:1}}

  #cursor{position:fixed;top:0;left:0;width:14px;height:14px;border:1px solid var(--acc);border-radius:50%;
    transform:translate(-50%,-50%);pointer-events:none;z-index:5;transition:width .3s,height .3s,background .3s;mix-blend-mode:screen}
</style>
</head>
<body>
  <div class="bar">
    <span>03 · Magnetic field</span>
    <a href="../index.html">← Type Motion</a>
  </div>

  <div id="stage" aria-label="come a little closer"></div>
  <p class="cap">Move slowly. Each letter leans toward you.</p>
  <div id="cursor"></div>

<script>
(function(){
  const phrase='come a little closer';
  const stage=document.getElementById('stage');
  const letters=[];
  phrase.split(' ').forEach(word=>{
    const w=document.createElement('span'); w.className='word';
    for(const ch of word){
      const s=document.createElement('span'); s.textContent=ch;
      w.appendChild(s);
      letters.push({el:s,bx:0,by:0,x:0,y:0,tw:300,cw:300});
    }
    stage.appendChild(w);
  });

  const R=190;                    // influence radius (px)
  let cx=-9999, cy=-9999;         // cursor
  const cur=document.getElementById('cursor');

  function measure(){
    letters.forEach(l=>{
      const prev=l.el.style.transform; l.el.style.transform='none';
      const r=l.el.getBoundingClientRect();
      l.bx=r.left+r.width/2; l.by=r.top+r.height/2;
      l.el.style.transform=prev;
    });
  }
  addEventListener('resize',measure);
  (document.fonts?document.fonts.ready:Promise.resolve()).then(()=>setTimeout(measure,60));
  setTimeout(measure,400);

  addEventListener('pointermove',e=>{
    cx=e.clientX; cy=e.clientY;
    cur.style.left=cx+'px'; cur.style.top=cy+'px';
  });
  addEventListener('pointerleave',()=>{cx=-9999;cy=-9999;});

  function frame(){
    let near=false;
    for(const l of letters){
      const dx=cx-l.bx, dy=cy-l.by;
      const dist=Math.hypot(dx,dy);
      const fall=Math.max(0,1-dist/R);
      const e=fall*fall;                 // soft ease-in of influence
      if(e>0.02) near=true;
      const tx=dx*e*0.34, ty=dy*e*0.34;  // pull toward cursor
      l.x+=(tx-l.x)*0.12; l.y+=(ty-l.y)*0.12;    // spring
      l.tw=300+e*430;
      l.cw+=(l.tw-l.cw)*0.12;
      const s=1+e*0.10;
      l.el.style.transform='translate('+l.x.toFixed(2)+'px,'+l.y.toFixed(2)+'px) scale('+s.toFixed(3)+')';
      l.el.style.fontVariationSettings='"opsz" 120,"wght" '+l.cw.toFixed(0);
    }
    cur.style.width=cur.style.height=(near?26:14)+'px';
    cur.style.background=near?'rgba(201,162,74,.14)':'transparent';
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
<script src="../nav.js" defer></script>
</body>
</html>
