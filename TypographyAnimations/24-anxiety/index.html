<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Anxiety — a study in nerves</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Space+Mono&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#101416;--ink:#e6e9ea;--dim:#7c8384;--acc:#d0d24e;--line:rgba(230,233,234,.16);--on:#101416}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Fraunces",serif;overflow:hidden;
    display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
  .bar{position:fixed;top:clamp(18px,3vw,34px);left:0;right:0;display:flex;justify-content:space-between;
    padding:0 clamp(18px,3vw,34px);font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--dim);z-index:3}
  .bar a{color:var(--dim);text-decoration:none;border-bottom:1px solid transparent;transition:.4s}
  .bar a:hover{color:var(--ink);border-color:var(--ink)}

  .word{font-weight:500;font-size:clamp(48px,14vw,210px);line-height:.9;letter-spacing:-.01em;user-select:none}
  .word span{display:inline-block;will-change:transform}

  .cap{position:fixed;left:0;right:0;bottom:clamp(22px,4vw,40px);text-align:center;font-style:italic;font-weight:400;
    color:var(--dim);font-size:clamp(14px,1.8vw,20px)}
  .cap b{font-style:normal;color:var(--acc);font-weight:500}

  .panel{position:fixed;top:calc(clamp(18px,3vw,34px) + 32px);right:clamp(18px,3vw,34px);z-index:4;width:224px;
    font-family:"Space Mono",monospace;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(6px)}
  .panel .head{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;cursor:pointer;
    font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
  .panel .head .tw{color:var(--ink)}
  .panel .body{padding:2px 13px 14px;display:flex;flex-direction:column;gap:13px}
  .panel.collapsed .body{display:none}
  .row{display:flex;flex-direction:column;gap:6px}
  .row label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between;gap:8px}
  .row label .val{color:var(--ink)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2px;background:var(--line);border-radius:2px;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--acc);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--acc);cursor:pointer}
  .seg-ctl{display:flex;gap:2px;border:1px solid var(--line);border-radius:20px;padding:2px}
  .seg-ctl button{flex:1;font-family:inherit;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
    background:transparent;border:0;padding:6px;border-radius:20px;cursor:pointer;transition:.3s}
  .seg-ctl button.active{background:var(--acc);color:var(--on)}
</style>
</head>
<body>
  <div class="bar"><span>Inner states · Anxiety</span><a href="../index.html">← Type Motion</a></div>

  <div class="word" id="word"></div>

  <p class="cap">It winds tighter and tighter — then <b>lets go</b>. Approach and it worsens.</p>

  <div class="panel" id="panel">
    <div class="head" id="panelHead"><span>Parameters</span><span class="tw">tweak ▾</span></div>
    <div class="body" id="panelBody"></div>
  </div>

<script>
(function(){
  const cfg = {
    build:      0.16,  // how fast the tension mounts (per second)
    jitter:     14,    // maximum tremor (px) at full anxiety
    proximity:  120,   // how strongly nearness winds it up
    flareRate:  0.7,   // how often a letter flushes red (scaled by anxiety)
    boltRate:   0.5,   // how often a letter bolts away
    boltForce:  720,   // how hard it bolts (px/s)
    returnSpeed:7,     // spring pulling it home — lower = slower return
    flare:      true,  // red flares on/off
    bolt:       true   // letters shooting out on/off
  };
  const RELEASE=1.0;                       // level at which it snaps and lets go
  const INK=[230,233,234], RED=[224,71,58];

  const wordEl=document.getElementById('word');
  const word='anxiety';
  const L=[...word].map(ch=>{ const s=document.createElement('span'); s.textContent=ch; wordEl.appendChild(s);
    return {el:s, ox:0,oy:0,vx:0,vy:0, red:0}; });
  let a=0.1, px=-9999, py=-9999, last=performance.now();
  addEventListener('pointermove', e=>{ px=e.clientX; py=e.clientY; });
  addEventListener('pointerleave', ()=>{ px=-9999; py=-9999; });

  function frame(now){
    let dt=Math.min((now-last)/1000,.032); last=now;
    a += cfg.build*dt;
    const dx=px-innerWidth/2, dy=py-innerHeight/2, dist=Math.hypot(dx,dy);
    if(dist<cfg.proximity*2.4) a += (1-dist/(cfg.proximity*2.4))*0.9*dt;   // nearness feeds it
    if(a>=RELEASE) a=0.06;                                                // the release
    a=Math.max(0,Math.min(1.25,a));

    const amp=cfg.jitter*a*a;                             // eases in — barely there at first
    const k=cfg.returnSpeed, c=2*Math.sqrt(k)*0.55;       // underdamped ⇒ it drifts back slowly
    for(const o of L){
      if(cfg.flare && Math.random() < cfg.flareRate*a*dt) o.red=1;                       // intrusive flash
      if(cfg.bolt && Math.random() < cfg.boltRate*a*dt){                                  // a panic bolt
        const ang=Math.random()*Math.PI*2, f=cfg.boltForce*(0.6+Math.random()*0.6);
        o.vx+=Math.cos(ang)*f; o.vy+=Math.sin(ang)*f; o.red=1;
      }
      o.vx+=(-k*o.ox - c*o.vx)*dt; o.vy+=(-k*o.oy - c*o.vy)*dt;   // spring home
      o.ox+=o.vx*dt; o.oy+=o.vy*dt;
      o.red=Math.max(0, o.red - dt*0.8);                          // red fades back
      const jx=(Math.random()*2-1)*amp, jy=(Math.random()*2-1)*amp, jr=(Math.random()*2-1)*amp*0.35;
      o.el.style.transform='translate('+(o.ox+jx).toFixed(1)+'px,'+(o.oy+jy).toFixed(1)+'px) rotate('+jr.toFixed(2)+'deg)';
      const col=INK.map((v,i)=>Math.round(v+(RED[i]-v)*o.red));
      o.el.style.color='rgb('+col[0]+','+col[1]+','+col[2]+')';
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  const spec=[
    {type:'range', key:'build',      label:'Build rate', min:.03,max:.6,  step:.01},
    {type:'range', key:'jitter',     label:'Max tremor', min:2,  max:40,  step:1},
    {type:'range', key:'flareRate',  label:'Flare rate', min:0,  max:2,   step:.05},
    {type:'range', key:'boltRate',   label:'Bolt rate',  min:0,  max:2,   step:.05},
    {type:'range', key:'boltForce',  label:'Bolt force', min:200,max:1400,step:20},
    {type:'range', key:'returnSpeed',label:'Return',     min:1,  max:24,  step:.5},
    {type:'range', key:'proximity',  label:'Proximity',  min:0,  max:260, step:10},
    {type:'toggle',key:'flare',      label:'Flare (red)',options:[['off',false],['on',true]]},
    {type:'toggle',key:'bolt',       label:'Bolt out',   options:[['off',false],['on',true]]}
  ];
  buildPanel(document.getElementById('panelBody'), spec, cfg);
  const panel=document.getElementById('panel');
  document.getElementById('panelHead').addEventListener('click',()=>panel.classList.toggle('collapsed'));

  function buildPanel(root, spec, cfg){
    spec.forEach(c=>{
      const row=document.createElement('div'); row.className='row';
      const lab=document.createElement('label'); lab.textContent=c.label;
      if(c.type==='range'){
        const val=document.createElement('span'); val.className='val'; val.textContent=cfg[c.key];
        lab.appendChild(val); row.appendChild(lab);
        const inp=document.createElement('input'); inp.type='range';
        inp.min=c.min; inp.max=c.max; inp.step=c.step; inp.value=cfg[c.key];
        inp.addEventListener('input',()=>{ cfg[c.key]=parseFloat(inp.value); val.textContent=inp.value; });
        row.appendChild(inp);
      } else {
        row.appendChild(lab);
        const g=document.createElement('div'); g.className='seg-ctl';
        c.options.forEach(([t,v])=>{
          const b=document.createElement('button'); b.textContent=t;
          if(cfg[c.key]===v) b.classList.add('active');
          b.addEventListener('click',()=>{ cfg[c.key]=v; g.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b)); });
          g.appendChild(b);
        });
        row.appendChild(g);
      }
      root.appendChild(row);
    });
  }
})();
</script>
</body>
</html>
