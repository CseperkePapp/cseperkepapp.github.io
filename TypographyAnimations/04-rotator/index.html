<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rotator — a study in substitution</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Space+Mono&display=swap" rel="stylesheet" />
<style>
  :root{--paper:#efeae0;--ink:#1a1712;--dim:#8b8474;--acc:#2f6b5e}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--paper);color:var(--ink);font-family:"Fraunces",serif;overflow:hidden;
    display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
  .bar{position:fixed;top:clamp(18px,3vw,34px);left:0;right:0;display:flex;justify-content:space-between;
    padding:0 clamp(18px,3vw,34px);font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--dim)}
  .bar a{color:var(--dim);text-decoration:none;border-bottom:1px solid transparent;transition:.4s}
  .bar a:hover{color:var(--ink);border-color:var(--ink)}

  .phrase{display:flex;align-items:baseline;gap:.3em;font-weight:300;
    font-size:clamp(40px,8.5vw,128px);line-height:1.1;letter-spacing:-.01em;user-select:none;flex-wrap:wrap;justify-content:center;padding:0 5vw}
  .rot{position:relative;display:inline-block;overflow:hidden;height:1.1em;vertical-align:baseline;
    transition:width .9s cubic-bezier(.16,1,.3,1)}
  .rot .w{position:absolute;left:0;top:0;line-height:1.1em;white-space:nowrap;font-style:italic;color:var(--acc);
    transition:transform .9s cubic-bezier(.16,1,.3,1),opacity .8s ease,filter .8s ease}
  .rot .w::after{content:".";color:var(--ink);font-style:normal}

  .cap{position:fixed;left:0;right:0;bottom:clamp(22px,4vw,40px);text-align:center;color:var(--dim);
    font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase}
</style>
</head>
<body>
  <div class="bar">
    <span>04 · Word rotator</span>
    <a href="../index.html">← Type Motion</a>
  </div>

  <div class="phrase">
    <span>Type is</span>
    <span class="rot" id="rot"></span>
  </div>
  <p class="cap">substituting · click to advance</p>

<script>
(function(){
  const words=['structure','rhythm','restraint','a silence','tempo','a voice','weight'];
  const rot=document.getElementById('rot');
  let i=0, cur=null, timer=null;

  function makeWord(txt){
    const w=document.createElement('span');
    w.className='w'; w.textContent=txt;
    return w;
  }
  function show(first){
    const w=makeWord(words[i]);
    if(first){ w.style.transform='translateY(0)'; }
    else { w.style.transform='translateY(110%)'; w.style.opacity='0'; w.style.filter='blur(5px)'; }
    rot.appendChild(w);
    const width=w.getBoundingClientRect().width;
    // reflow, then animate width + swap
    rot.getBoundingClientRect();
    requestAnimationFrame(()=>{
      rot.style.width=Math.ceil(width)+'px';
      w.style.transform='translateY(0)'; w.style.opacity='1'; w.style.filter='blur(0)';
      if(cur){
        const old=cur;
        old.style.transform='translateY(-110%)'; old.style.opacity='0'; old.style.filter='blur(5px)';
        setTimeout(()=>old.remove(),950);
      }
      cur=w;
    });
    i=(i+1)%words.length;
  }
  function tick(){ show(false); }
  function restart(){ clearInterval(timer); timer=setInterval(tick,2600); }

  addEventListener('pointerdown',()=>{ show(false); restart(); });

  (document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{
    show(true);
    restart();
  });
})();
</script>
<script src="../nav.js" defer></script>
</body>
</html>
