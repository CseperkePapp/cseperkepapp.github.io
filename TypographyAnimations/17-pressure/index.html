<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pressure — a study in compression</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Space+Mono&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#16151a;--ink:#eeecec;--dim:#82808a;--acc:#d0463a;--line:rgba(238,236,236,.16);--on:#16151a}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Fraunces",serif;overflow:hidden;
    display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased;cursor:pointer}
  .bar{position:fixed;top:clamp(18px,3vw,34px);left:0;right:0;display:flex;justify-content:space-between;
    padding:0 clamp(18px,3vw,34px);font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--dim);z-index:3}
  .bar a{color:var(--dim);text-decoration:none;border-bottom:1px solid transparent;transition:.4s}
  .bar a:hover{color:var(--ink);border-color:var(--ink)}

  .word{font-weight:400;font-size:clamp(46px,13vw,200px);line-height:.9;letter-spacing:0;transform-origin:center center;
    will-change:transform,font-variation-settings;font-variation-settings:"wght" 300;user-select:none}
  .plate{position:fixed;left:0;top:0;width:8px;background:var(--acc);border-radius:3px;will-change:transform;z-index:1;
    box-shadow:0 0 18px rgba(208,70,58,.35)}

  .cap{position:fixed;left:0;right:0;bottom:clamp(22px,4vw,40px);text-align:center;font-style:italic;font-weight:300;
    color:var(--dim);font-size:clamp(14px,1.8vw,20px);z-index:3}
  .cap b{font-style:normal;color:var(--acc);font-weight:400}

  .panel{position:fixed;top:calc(clamp(18px,3vw,34px) + 32px);right:clamp(18px,3vw,34px);z-index:4;width:224px;
    font-family:"Space Mono",monospace;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(6px)}
  .panel .head{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;cursor:pointer;
    font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
  .panel .head .tw{color:var(--ink)}
  .panel .body{padding:2px 13px 14px;display:flex;flex-direction:column;gap:13px}
  .panel.collapsed .body{display:none}
  .row{display:flex;flex-direction:column;gap:6px}
  .row label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between;gap:8px}
  .row label .val{color:var(--ink)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2px;background:var(--line);border-radius:2px;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--acc);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--acc);cursor:pointer}
  .seg-ctl{display:flex;gap:2px;border:1px solid var(--line);border-radius:20px;padding:2px}
  .seg-ctl button{flex:1;font-family:inherit;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
    background:transparent;border:0;padding:6px;border-radius:20px;cursor:pointer;transition:.3s}
  .seg-ctl button.active{background:var(--acc);color:var(--on)}
</style>
</head>
<body>
  <div class="bar"><span>Physical forces · Pressure</span><a href="../index.html">← Type Motion</a></div>

  <div class="plate" id="pl"></div>
  <div class="word" id="word">pressure</div>
  <div class="plate" id="pr"></div>

  <p class="cap"><b>Press and hold</b> — the plates drive in and condense it.</p>

  <div class="panel" id="panel">
    <div class="head" id="panelHead"><span>Parameters</span><span class="tw">tweak ▾</span></div>
    <div class="body" id="panelBody"></div>
  </div>

<script>
(function(){
  const cfg = {
    maxComp:  0.5,    // how far it squashes (scaleX reduction at full pressure)
    stiffness:90,     // how eagerly pressure follows the target
    damping:  7,      // low ⇒ it springs past on release (relief)
    gap:      12,     // clearance between plate face and word edge (px)
    cycle:    1.3,    // auto squeeze speed
    auto:     false
  };
  const PW=8;         // plate width (matches CSS)

  const word=document.getElementById('word'), pl=document.getElementById('pl'), pr=document.getElementById('pr');
  let W0=400, CX=0, CY=0;
  function measure(){
    W0=word.offsetWidth; CX=innerWidth/2; CY=innerHeight/2;
    const h=word.offsetHeight*0.92;
    pl.style.height=pr.style.height=h+'px';
    pl.style.top=pr.style.top=(CY-h/2)+'px';
  }
  (document.fonts?document.fonts.ready:Promise.resolve()).then(()=>setTimeout(measure,60));
  setTimeout(measure,400); addEventListener('resize',measure);

  let p=0, vp=0, holding=false, t=0, last=performance.now();
  function frame(now){
    let dt=Math.min((now-last)/1000,.032); last=now; t+=dt;
    const target = holding ? 1 : (cfg.auto ? 0.5+0.5*Math.sin(t*cfg.cycle) : 0);
    for(let s=0;s<2;s++){ const h=dt/2; vp+=(-cfg.stiffness*(p-target) - cfg.damping*vp)*h; p+=vp*h; }
    p=Math.max(-0.28,Math.min(1.15,p));

    const sx=Math.max(.2,Math.min(1.4, 1 - p*cfg.maxComp));
    word.style.transform='scaleX('+sx.toFixed(3)+')';
    word.style.fontVariationSettings='"wght" '+(300+Math.max(0,p)*560).toFixed(0);

    // pin each plate's inner face flush to the word's live compressed edge
    const halfVis=(W0/2)*sx;
    pl.style.transform='translateX('+(CX - halfVis - cfg.gap - PW).toFixed(1)+'px)';
    pr.style.transform='translateX('+(CX + halfVis + cfg.gap).toFixed(1)+'px)';
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  addEventListener('pointerdown', e=>{ if(e.target.closest('.panel')) return; holding=true; });
  addEventListener('pointerup', ()=>{ holding=false; });

  const spec=[
    {type:'range', key:'maxComp',  label:'Compression',min:.1, max:.85,step:.05},
    {type:'range', key:'stiffness',label:'Stiffness',  min:20, max:220,step:5},
    {type:'range', key:'damping',  label:'Damping',    min:1,  max:24, step:.5},
    {type:'range', key:'gap',      label:'Plate gap',  min:0,  max:60, step:2},
    {type:'range', key:'cycle',    label:'Auto speed', min:.3, max:4,  step:.1},
    {type:'toggle',key:'auto',     label:'Auto-cycle', options:[['off',false],['on',true]]}
  ];
  buildPanel(document.getElementById('panelBody'), spec, cfg);
  const panel=document.getElementById('panel');
  document.getElementById('panelHead').addEventListener('click',()=>panel.classList.toggle('collapsed'));

  function buildPanel(root, spec, cfg){
    spec.forEach(c=>{
      const row=document.createElement('div'); row.className='row';
      const lab=document.createElement('label'); lab.textContent=c.label;
      if(c.type==='range'){
        const val=document.createElement('span'); val.className='val'; val.textContent=cfg[c.key];
        lab.appendChild(val); row.appendChild(lab);
        const inp=document.createElement('input'); inp.type='range';
        inp.min=c.min; inp.max=c.max; inp.step=c.step; inp.value=cfg[c.key];
        inp.addEventListener('input',()=>{ cfg[c.key]=parseFloat(inp.value); val.textContent=inp.value; });
        row.appendChild(inp);
      } else {
        row.appendChild(lab);
        const g=document.createElement('div'); g.className='seg-ctl';
        c.options.forEach(([t,v])=>{
          const b=document.createElement('button'); b.textContent=t;
          if(cfg[c.key]===v) b.classList.add('active');
          b.addEventListener('click',()=>{ cfg[c.key]=v; g.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b)); });
          g.appendChild(b);
        });
        row.appendChild(g);
      }
      root.appendChild(row);
    });
  }
})();
</script>
</body>
</html>
