<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Silence — a study in stillness</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,200..400&family=Space+Mono&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#0d0e10;--ink:#d9dbe0;--dim:#6f7684;--acc:#7e8798;--line:rgba(217,219,224,.14);--on:#0d0e10}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Fraunces",serif;overflow:hidden;
    display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
  .bar{position:fixed;top:clamp(18px,3vw,34px);left:0;right:0;display:flex;justify-content:space-between;
    padding:0 clamp(18px,3vw,34px);font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--dim);z-index:3}
  .bar a{color:var(--dim);text-decoration:none;border-bottom:1px solid transparent;transition:.4s}
  .bar a:hover{color:var(--ink);border-color:var(--ink)}

  #ripples{position:fixed;inset:0;z-index:1;pointer-events:none}
  .ring{position:absolute;border:1px solid var(--acc);border-radius:50%;transform:translate(-50%,-50%);will-change:width,height,opacity}

  .word{position:relative;z-index:2;font-weight:300;font-size:clamp(28px,6vw,84px);letter-spacing:.42em;text-indent:.42em;
    user-select:none;will-change:opacity}

  .cap{position:fixed;left:0;right:0;bottom:clamp(22px,4vw,40px);text-align:center;font-style:italic;font-weight:300;
    color:var(--dim);font-size:clamp(13px,1.6vw,18px)}
  .cap b{font-style:normal;color:var(--ink);font-weight:400}

  .panel{position:fixed;top:calc(clamp(18px,3vw,34px) + 32px);right:clamp(18px,3vw,34px);z-index:4;width:224px;
    font-family:"Space Mono",monospace;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(6px)}
  .panel .head{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;cursor:pointer;
    font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
  .panel .head .tw{color:var(--ink)}
  .panel .body{padding:2px 13px 14px;display:flex;flex-direction:column;gap:13px}
  .panel.collapsed .body{display:none}
  .row{display:flex;flex-direction:column;gap:6px}
  .row label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between;gap:8px}
  .row label .val{color:var(--ink)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2px;background:var(--line);border-radius:2px;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--acc);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--acc);cursor:pointer}
</style>
</head>
<body>
  <div class="bar"><span>Abstract · Silence</span><a href="../index.html">← Type Motion</a></div>

  <div id="ripples"></div>
  <div class="word" id="word">silence</div>

  <p class="cap">It swallows every sound. <b>Make noise</b> — it returns to still.</p>

  <div class="panel" id="panel">
    <div class="head" id="panelHead"><span>Parameters</span><span class="tw">tweak ▾</span></div>
    <div class="body" id="panelBody"></div>
  </div>

<script>
(function(){
  const cfg = {
    presence: 0.6,   // how present the word is
    ripple:   1.0,   // how far a disturbance spreads
    absorb:   1.3    // seconds before silence has swallowed it (lower = quieter)
  };

  const wordEl=document.getElementById('word'), layer=document.getElementById('ripples');
  const ripples=[]; let lastSpawn=0;

  function spawn(x,y,strength){
    const el=document.createElement('div'); el.className='ring';
    el.style.left=x+'px'; el.style.top=y+'px'; layer.appendChild(el);
    ripples.push({el, x, y, r:5, life:0, max:cfg.absorb*(0.7+Math.random()*0.5), str:strength});
  }
  addEventListener('pointerdown', e=>{ if(e.target.closest('.panel')) return; spawn(e.clientX,e.clientY,1.5); });
  addEventListener('pointermove', e=>{ const n=performance.now(); if(n-lastSpawn>55){ lastSpawn=n; spawn(e.clientX,e.clientY,0.8); } });

  let last=performance.now();
  function frame(now){
    let dt=Math.min((now-last)/1000,.032); last=now;
    // the word: still, with only the faintest slow presence
    wordEl.style.opacity=(cfg.presence + 0.05*Math.sin(now/2600)).toFixed(3);
    for(let k=ripples.length-1;k>=0;k--){
      const p=ripples[k]; p.life+=dt;
      const f=p.life/p.max;                              // 0→1 as it is absorbed
      p.r += (cfg.ripple*230/p.max)*dt;
      const d=(p.r*2).toFixed(0);
      p.el.style.width=d+'px'; p.el.style.height=d+'px';
      p.el.style.opacity=(Math.max(0,1-f)*0.5*p.str).toFixed(3);
      if(f>=1){ p.el.remove(); ripples.splice(k,1); }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  const spec=[
    {type:'range', key:'presence',label:'Presence',min:.15,max:1,  step:.05},
    {type:'range', key:'ripple',  label:'Spread',  min:.3, max:2.5,step:.1},
    {type:'range', key:'absorb',  label:'Absorb',  min:.4, max:3,  step:.1}
  ];
  buildPanel(document.getElementById('panelBody'), spec, cfg);
  const panel=document.getElementById('panel');
  document.getElementById('panelHead').addEventListener('click',()=>panel.classList.toggle('collapsed'));

  function buildPanel(root, spec, cfg){
    spec.forEach(c=>{
      const row=document.createElement('div'); row.className='row';
      const lab=document.createElement('label'); lab.textContent=c.label;
      const val=document.createElement('span'); val.className='val'; val.textContent=cfg[c.key];
      lab.appendChild(val); row.appendChild(lab);
      const inp=document.createElement('input'); inp.type='range';
      inp.min=c.min; inp.max=c.max; inp.step=c.step; inp.value=cfg[c.key];
      inp.addEventListener('input',()=>{ cfg[c.key]=parseFloat(inp.value); val.textContent=inp.value; });
      row.appendChild(inp);
      root.appendChild(row);
    });
  }
})();
</script>
<script src="../nav.js" defer></script>
</body>
</html>
